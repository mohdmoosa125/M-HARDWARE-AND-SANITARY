<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | M Hardware & Sanitary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="contact">

  <div id="site-nav"></div>

  <main id="app">

    <div class="page-head">
      <h1>Contact Us</h1>
      <p>We're happy to help with your project</p>
    </div>

    <div class="section">
      <div class="products-layout" style="grid-template-columns:1fr 1.3fr">

        <div class="form-card" style="margin:0;max-width:100%">
          <h2>Store Details</h2>
          <p id="cAddress">📍 —</p>
          <p>📞 <a id="cPhone" href="#">—</a></p>
          <p>💬 <a id="cWhatsapp" href="#">WhatsApp</a></p>
          <p>✉️ <a id="cEmail" href="#">—</a></p>
          <p>🕒 <span id="cHours">—</span></p>
          <div id="cMap" class="mt-2"></div>
        </div>

        <div class="form-card" style="margin:0;max-width:100%">
          <h2>Send a Message</h2>
          <div id="contactAlert"></div>
          <form id="contactForm">
            <div class="form-group"><label>Name *</label><input name="name" required></div>
            <div class="form-row">
              <div class="form-group"><label>Phone</label><input name="phone"></div>
              <div class="form-group"><label>Email</label><input type="email" name="email"></div>
            </div>
            <div class="form-group"><label>Message *</label>
              <textarea name="message" required></textarea></div>
            <button class="btn btn-primary btn-block" type="submit">Send Message</button>
          </form>
        </div>
      </div>
    </div>

  </main>

  <div id="site-footer"></div>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/products.js"></script>
  <script src="js/search.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/ai-assistant.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
