<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | M Hardware & Sanitary</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <h1>🛠️ Admin Login</h1>
    <p class="sub">M Hardware &amp; Sanitary Control Panel</p>

    <div id="loginAlert"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Username or Email</label>
        <input name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Login</button>
    </form>

    <p style="text-align:center;color:#6b7280;font-size:.82rem;margin-top:18px">
      Default: <b>admin</b> / <b>admin123</b> — change it after first login.
    </p>
  </div>
</div>

<script src="js/admin.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const box = document.getElementById("loginAlert");
    const payload = Object.fromEntries(new FormData(e.target).entries());
    try {
      await api("/auth/login", { method: "POST", body: JSON.stringify(payload) });
      location.href = "dashboard.html";
    } catch (err) {
      box.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
    }
  });
</script>
</body>
</html>
