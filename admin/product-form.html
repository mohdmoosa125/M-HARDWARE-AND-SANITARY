<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Form | M Hardware Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <script src="js/admin.js"></script>
  <script>
    let editingId = null;
    let categories = [];
    let uploadedImage = "";
    let extraImages = [];

    async function init() {
      const host = await renderAdminShell("products.html");
      if (!host) return;

      editingId = new URLSearchParams(location.search).get("id");
      document.getElementById("pageTitle").textContent =
        editingId ? "Edit Product" : "Add Product";

      // load categories for the dropdown
      try {
        const res = await api("/categories");
        categories = res.data || [];
      } catch { categories = []; }

      host.innerHTML = `
        <div class="card">
          <div id="formAlert"></div>
          <form id="productForm">
            <div class="form-row">
              <div class="form-group"><label>Product Name *</label>
                <input name="name" required></div>
              <div class="form-group"><label>Brand</label>
                <input name="brand"></div>
            </div>

            <div class="form-row">
              <div class="form-group"><label>Category</label>
                <select name="category_id" id="catSelect"></select></div>
              <div class="form-group"><label>SKU</label>
                <input name="sku"></div>
            </div>

            <div class="form-row">
              <div class="form-group"><label>Price (₹) *</label>
                <input type="number" step="0.01" name="price" required></div>
              <div class="form-group"><label>Discount Price (₹)</label>
                <input type="number" step="0.01" name="discount_price"></div>
            </div>

            <div class="form-row">
              <div class="form-group"><label>Unit</label>
                <input name="unit" placeholder="piece / box / kg"></div>
              <div class="form-group"><label>Stock</label>
                <input type="number" name="stock" value="0"></div>
            </div>

            <div class="form-group"><label>Short Description</label>
              <input name="short_description"></div>

            <div class="form-group"><label>Full Description</label>
              <textarea name="description"></textarea></div>

            <div class="form-row">
              <div class="form-group"><label>Material</label><input name="material"></div>
              <div class="form-group"><label>Size</label><input name="size"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Colour</label><input name="color"></div>
              <div class="form-group"><label>Weight</label><input name="weight"></div>
            </div>

            <h3 class="mt-2">Tile / Sanitary Extras (optional)</h3>
            <div class="form-row">
              <div class="form-group"><label>Finish</label><input name="finish"></div>
              <div class="form-group"><label>Thickness</label><input name="thickness"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Pieces per box</label>
                <input type="number" name="pieces_per_box"></div>
              <div class="form-group"><label>Coverage</label>
                <input name="coverage" placeholder="e.g. 1.44 sq m"></div>
            </div>

            <div class="form-group">
              <label>Product Image</label>
              <input type="file" id="imageFile" accept="image/*">
              ${editingId ? `<button type="button" class="btn btn-outline btn-sm" id="regenBtn" style="margin-left:8px">🔄 Generate with AI</button>` : ""}
              <input type="hidden" name="image" id="imagePath">
              <div id="imagePreview" style="margin-top:10px"></div>
            </div>

            <div class="form-group">
              <label>Additional Images (optional)</label>
              <input type="file" id="extraFiles" accept="image/*" multiple>
              <input type="hidden" name="additional_images" id="extraPaths">
              <div id="extraPreview" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div>
            </div>

            <div class="form-row">
              <div class="form-group checkbox-row">
                <input type="checkbox" name="availability" id="availability" checked>
                <label for="availability" style="margin:0">Available in stock</label>
              </div>
              <div class="form-group checkbox-row">
                <input type="checkbox" name="featured" id="featured">
                <label for="featured" style="margin:0">Show on homepage (Featured)</label>
              </div>
            </div>

            <div style="display:flex;gap:10px;margin-top:10px">
              <button class="btn btn-primary" type="submit">💾 Save Product</button>
              <a class="btn btn-outline" href="products.html">Cancel</a>
            </div>
          </form>
        </div>`;

      fillCategorySelect();
      bindImageUpload();
      bindExtraUpload();
      const regen = document.getElementById("regenBtn");
      if (regen) regen.addEventListener("click", () => regenerateImage(editingId, regen, (d) => {
        uploadedImage = d.image || "";
        document.getElementById("imagePath").value = uploadedImage;
        document.getElementById("imagePreview").innerHTML =
          uploadedImage ? `<img src="${uploadedImage}?t=${Date.now()}" style="max-width:160px;border-radius:10px">` : "";
        document.getElementById("formAlert").innerHTML =
          `<div class="alert alert-success">Image ${esc(d.image_status)}: ${esc(d.result.detail)}</div>`;
      }));

      if (editingId) await loadProduct(editingId);

      document.getElementById("productForm").addEventListener("submit", saveProduct);
    }

    function fillCategorySelect(selectedId) {
      const sel = document.getElementById("catSelect");
      sel.innerHTML = `<option value="">— No category —</option>`;

      categories.filter((c) => !c.parent_id).forEach((parent) => {
        sel.innerHTML += `<option value="${parent.id}" ${selectedId == parent.id ? "selected" : ""}>
            ${esc(parent.name)}
          </option>`;
        (parent.children || []).forEach((child) => {
          sel.innerHTML += `<option value="${child.id}" ${selectedId == child.id ? "selected" : ""}>
              &nbsp;&nbsp;↳ ${esc(child.name)}
            </option>`;
        });
      });
    }

    function bindImageUpload() {
      document.getElementById("imageFile").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fd = new FormData();
        fd.append("file", file);

        const res = await fetch("/api/upload/products", {
          method: "POST",
          body: fd,
          credentials: "same-origin",
        });
        const data = await res.json();

        if (data.success) {
          uploadedImage = data.data.url;
          document.getElementById("imagePath").value = uploadedImage;
          document.getElementById("imagePreview").innerHTML =
            `<img src="${uploadedImage}" style="max-width:160px;border-radius:10px">`;
        } else {
          alert("Upload failed: " + data.message);
        }
      });
    }

    function renderExtra() {
      document.getElementById("extraPaths").value = JSON.stringify(extraImages);
      document.getElementById("extraPreview").innerHTML = extraImages.map((u, i) =>
        `<span style="position:relative"><img src="${esc(u)}" style="width:80px;height:80px;object-fit:cover;border-radius:8px">
         <button type="button" onclick="removeExtra(${i})" style="position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer">×</button></span>`).join("");
    }

    function removeExtra(i) { extraImages.splice(i, 1); renderExtra(); }

    function bindExtraUpload() {
      document.getElementById("extraFiles").addEventListener("change", async (e) => {
        for (const file of e.target.files) {
          const fd = new FormData();
          fd.append("file", file);
          try {
            const res = await fetch("/api/upload/products", { method: "POST", body: fd, credentials: "same-origin" });
            const data = await res.json();
            if (!data.success) throw new Error(data.message);
            extraImages.push(data.data.url);
            renderExtra();
          } catch (err) {
            alert("Upload failed: " + err.message);
          }
        }
        e.target.value = "";
      });
    }

    async function loadProduct(id) {
      try {
        const res = await api("/products/" + id);
        const p = res.data;
        uploadedImage = p.image || "";
        extraImages = p.additional_images || [];
        renderExtra();

        const form = document.getElementById("productForm");
        ["name","brand","sku","price","discount_price","unit","stock",
         "short_description","description","material","size","color","weight",
         "finish","thickness","pieces_per_box","coverage"].forEach((f) => {
          if (form[f] !== undefined && p[f] !== null && p[f] !== undefined) {
            form[f].value = p[f];
          }
        });

        document.getElementById("availability").checked = !!p.availability;
        document.getElementById("featured").checked = !!p.featured;
        document.getElementById("imagePath").value = uploadedImage;

        if (uploadedImage) {
          document.getElementById("imagePreview").innerHTML =
            `<img src="${uploadedImage}" style="max-width:160px;border-radius:10px">`;
        }

        fillCategorySelect(p.category_id);
      } catch (err) {
        document.getElementById("formAlert").innerHTML =
          `<div class="alert alert-error">${esc(err.message)}</div>`;
      }
    }

    async function saveProduct(e) {
      e.preventDefault();
      const form = e.target;
      const box = document.getElementById("formAlert");

      const payload = {
        name: form.name.value.trim(),
        brand: form.brand.value.trim(),
        sku: form.sku.value.trim(),
        category_id: form.category_id.value || null,
        price: form.price.value,
        discount_price: form.discount_price.value,
        unit: form.unit.value.trim() || "piece",
        stock: form.stock.value,
        short_description: form.short_description.value,
        description: form.description.value,
        material: form.material.value,
        size: form.size.value,
        color: form.color.value,
        weight: form.weight.value,
        finish: form.finish.value,
        thickness: form.thickness.value,
        pieces_per_box: form.pieces_per_box.value,
        coverage: form.coverage.value,
        image: uploadedImage,
        additional_images: extraImages,
        availability: form.availability.checked,
        featured: form.featured.checked,
      };

      try {
        if (editingId) {
          await api("/products/" + editingId, { method: "PUT", body: JSON.stringify(payload) });
          box.innerHTML = `<div class="alert alert-success">Product updated.</div>`;
        } else {
          await api("/products", { method: "POST", body: JSON.stringify(payload) });
          box.innerHTML = `<div class="alert alert-success">Product created.</div>`;
          form.reset();
          document.getElementById("imagePreview").innerHTML = "";
          uploadedImage = "";
          extraImages = [];
          renderExtra();
        }
        setTimeout(() => (location.href = "products.html"), 800);
      } catch (err) {
        box.innerHTML = `<div class="alert alert-error">${esc(err.message)}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
