<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders | M Hardware Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <script src="js/admin.js"></script>
  <script>
    async function init() {
      const host = await renderAdminShell("orders.html");
      if (!host) return;
      document.getElementById("pageTitle").textContent = "Orders";

      host.innerHTML = `<div class="card"><div id="ordersBox">
        <p class="loading">Loading orders…</p></div></div>`;

      try {
        const res = await api("/orders");
        const orders = res.data || [];

        if (!orders.length) {
          document.getElementById("ordersBox").innerHTML =
            `<p class="empty">No orders yet.</p>`;
          return;
        }

        document.getElementById("ordersBox").innerHTML = `
          <div class="table-wrap"><table>
            <thead>
              <tr><th>#</th><th>Customer</th><th>Phone</th><th>Items</th>
                  <th>Total</th><th>Status</th><th>Date</th></tr>
            </thead>
            <tbody>
              ${orders.map((o) => `
                <tr>
                  <td>#${o.id}</td>
                  <td>${esc(o.customer ? o.customer.name : "—")}</td>
                  <td>${esc(o.customer ? o.customer.phone : "—")}</td>
                  <td>${o.items.length} item(s)</td>
                  <td>${money(o.total)}</td>
                  <td>
                    <select onchange="updateStatus(${o.id}, this.value)"
                      style="padding:5px;border-radius:6px;border:1px solid #e5e7eb">
                      ${["new","quoted","confirmed","done","cancelled"].map((s) =>
                        `<option value="${s}" ${o.status === s ? "selected" : ""}>${s}</option>`
                      ).join("")}
                    </select>
                  </td>
                  <td>${new Date(o.created_at).toLocaleDateString()}</td>
                </tr>`).join("")}
            </tbody>
          </table></div>`;
      } catch (err) {
        document.getElementById("ordersBox").innerHTML =
          `<p class="empty">${esc(err.message)}</p>`;
      }
    }

    async function updateStatus(id, status) {
      try {
        await api("/orders/" + id, { method: "PUT", body: JSON.stringify({ status }) });
      } catch (err) {
        alert("Could not update: " + err.message);
      }
    }

    init();
  </script>
</body>
</html>
