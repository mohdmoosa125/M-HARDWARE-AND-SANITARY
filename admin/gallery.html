<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | M Hardware Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <script src="js/admin.js"></script>
  <script>
    const GAL_CATS = ["Shop", "Sanitary", "Tiles", "Hardware", "Machines", "Products", "Projects"];
    let uploadedUrl = "";

    async function init() {
      const host = await renderAdminShell("gallery.html", "Gallery");
      if (!host) return;

      host.innerHTML = `
        <div class="grid-2 grid-side">
          <div class="card">
            <h2>Add image</h2>
            <div class="form-group"><label for="gTitle">Title</label>
              <input id="gTitle" placeholder="e.g. Showroom front"></div>
            <div class="form-group"><label for="gCategory">Category</label>
              <select id="gCategory">${GAL_CATS.map((c) => `<option>${c}</option>`).join("")}</select></div>
            <div class="form-group"><label for="gFile">Image file</label>
              <input type="file" id="gFile" accept="image/*">
              <div class="img-preview" id="gPreview"></div></div>
            <button class="btn btn-primary" id="gAdd">${icon("plus")}Add to gallery</button>
          </div>
          <div class="card">
            <div class="card-head"><h2>Gallery images</h2><span class="sub" id="gCount"></span></div>
            <div id="galGrid">${loadingHTML()}</div>
          </div>
        </div>`;

      document.getElementById("gFile").addEventListener("change", uploadImage);
      document.getElementById("gAdd").addEventListener("click", addToGallery);
      await loadGallery();
    }

    async function uploadImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const prev = document.getElementById("gPreview");
      prev.innerHTML = loadingHTML("Uploading…");
      try {
        uploadedUrl = await apiUpload("gallery", file);
        prev.innerHTML = `<div class="img-tile" style="width:200px"><img src="${esc(uploadedUrl)}" alt="Upload preview" style="width:200px;height:140px"></div>`;
      } catch (err) {
        uploadedUrl = "";
        prev.innerHTML = "";
        toast("Upload failed: " + err.message, "error");
      }
    }

    async function addToGallery(e) {
      if (!uploadedUrl) { toast("Please choose an image first.", "error"); return; }
      await withBusy(e.currentTarget, async () => {
        try {
          await api("/gallery", {
            method: "POST",
            body: JSON.stringify({
              title: document.getElementById("gTitle").value,
              category: document.getElementById("gCategory").value,
              image: uploadedUrl,
            }),
          });
          toast("Image added to gallery", "success");
          uploadedUrl = "";
          document.getElementById("gPreview").innerHTML = "";
          document.getElementById("gTitle").value = "";
          document.getElementById("gFile").value = "";
          await loadGallery();
        } catch (err) {
          toast(err.message, "error");
        }
      }, "Adding…");
    }

    async function loadGallery() {
      const host = document.getElementById("galGrid");
      try {
        const items = (await api("/gallery")).data || [];
        document.getElementById("gCount").textContent = items.length ? `${items.length} images` : "";
        host.innerHTML = items.length ? `
          <div class="gallery-grid">
            ${items.map((g) => `
              <figure class="gallery-item" style="margin:0">
                <a href="${esc(g.image)}" target="_blank" rel="noopener"><img src="${esc(g.image)}" alt="${esc(g.title || "Gallery image")}" loading="lazy"></a>
                <figcaption class="hstack">
                  <span style="min-width:0"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.title || "Untitled")}</span>
                    <span class="badge badge-grey no-dot">${esc(g.category)}</span></span>
                  <button class="btn btn-danger-outline btn-sm" onclick="delImage(${Number(g.id)})" aria-label="Delete image ${esc(g.title || "")}">Delete</button>
                </figcaption>
              </figure>`).join("")}
          </div>` : emptyHTML("No gallery images yet.");
      } catch (err) {
        host.innerHTML = errorHTML(err.message);
      }
    }

    async function delImage(id) {
      if (!(await confirmDialog({ title: "Delete image?", message: "This image will be removed from the gallery.", confirmLabel: "Delete", danger: true }))) return;
      try { await api("/gallery/" + id, { method: "DELETE" }); toast("Image deleted", "success"); await loadGallery(); }
      catch (err) { toast(err.message, "error"); }
    }

    init();
  </script>
</body>
</html>
